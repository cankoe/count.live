name = "count-live"
main = "worker.js"
compatibility_date = "2024-12-01"

# Static assets (your HTML, CSS, JS)
[assets]
directory = "./"
binding = "ASSETS"  # Required for env.ASSETS.fetch() in worker
run_worker_first = true  # Run worker BEFORE serving static assets (for OG tag injection)

# Observability (logging) - PRIVACY NOTE:
# Logs may contain countdown URLs with user event titles/dates.
# Keep persist=false to avoid storing personal event data.
# Enable temporarily for debugging, then disable.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
