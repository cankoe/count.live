name = "count-live"
main = "worker.js"
compatibility_date = "2024-12-01"

# Static assets (your HTML, CSS, JS)
[assets]
directory = "./"
run_worker_first = true  # Run worker BEFORE serving static assets (for OG tag injection)

# Observability (logging)
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
