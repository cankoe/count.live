stages:
  - security
  - deploy

# Security scanning stage
security_audit:
  stage: security
  image: node:20-alpine
  script:
    # Check for known vulnerabilities in dependencies
    - npm audit --audit-level=high || true
    # Check for secrets accidentally committed (basic patterns)
    - |
      echo "Checking for potential secrets..."
      if grep -rE "(api[_-]?key|secret|password|token)\s*[:=]\s*['\"][^'\"]+['\"]" --include="*.js" --include="*.json" . 2>/dev/null | grep -v node_modules | grep -v package-lock; then
        echo "WARNING: Potential secrets found in code"
        exit 1
      fi
      echo "No obvious secrets detected"
  only:
    - main
    - merge_requests
  allow_failure: false

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html styles.css script.js logo.png CNAME sitemap.xml robots.txt public/
  artifacts:
    paths:
      - public
  only:
    - main
  needs:
    - security_audit
